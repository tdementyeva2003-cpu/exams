<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F2F4F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F141A" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DELF B2">
<link rel="manifest" href="manifest-delf.webmanifest">
<link rel="apple-touch-icon" href="icons/delf-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/delf-32.png">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Тренажёр DELF B2</title>
<style>
:root{--accent:#2F5BB7;--accent-soft:#E3EAF8;--accent-ink:#FFFFFF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--accent:#88A9F2;--accent-soft:#1C2742;--accent-ink:#0F141A}}
:root[data-theme="dark"]{--accent:#88A9F2;--accent-soft:#1C2742;--accent-ink:#0F141A}
/* Layout: header band + sticky section rail (desktop) / scroll strip (phone) + one working column */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --surface-2:#E8ECF1; --ink:#15202B; --muted:#596473; --line:#D5DBE3;
  --good:#17784A; --good-soft:#DDF2E6; --bad:#B42318; --bad-soft:#FBE4E1; --warn:#8A5A00;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F141A; --surface:#171E26; --surface-2:#202934; --ink:#E4E9EF; --muted:#98A3B1; --line:#2C3642;
    --good:#4CC38A; --good-soft:#143326; --bad:#F97066; --bad-soft:#3A1B19; --warn:#E3B341;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F141A; --surface:#171E26; --surface-2:#202934; --ink:#E4E9EF; --muted:#98A3B1; --line:#2C3642;
  --good:#4CC38A; --good-soft:#143326; --bad:#F97066; --bad-soft:#3A1B19; --warn:#E3B341;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-underline-offset:2px}
a:hover{text-decoration-thickness:2px}
code{font-family:var(--f-mono);font-size:.88em;background:var(--surface-2);padding:1px 5px;border-radius:5px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}

/* header */
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 18px;display:flex;flex-wrap:wrap;gap:16px 28px;align-items:flex-end;justify-content:space-between}
.brand{display:flex;gap:14px;align-items:center;min-width:0}
.stamp{font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.06em;color:var(--accent-ink);background:var(--accent);padding:10px 12px;border-radius:8px;white-space:nowrap}
.brand h1{font-family:var(--f-display);font-weight:600;font-size:clamp(20px,3.2vw,28px);line-height:1.15;margin:0;text-wrap:balance}
.brand p{margin:4px 0 0;color:var(--muted);font-size:14px}
.meta{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pill{font-family:var(--f-mono);font-size:12.5px;border:1px solid var(--line);background:var(--surface-2);padding:6px 10px;border-radius:999px;white-space:nowrap}
.pill b{color:var(--accent);font-weight:600}
.pill.hub{text-decoration:none;color:var(--ink)}
.pill.hub:hover{border-color:var(--accent);color:var(--accent)}
.datebox{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.datebox input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 8px;font-family:var(--f-mono);font-size:13px}

/* shell */
.app{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 80px;display:grid;grid-template-columns:220px minmax(0,1fr);gap:36px;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);display:flex;flex-direction:column;gap:2px}
.rail .grp{font-family:var(--f-mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:14px 10px 4px}
.rail .grp:first-child{margin-top:0}
.rail a{display:flex;justify-content:space-between;gap:8px;text-decoration:none;color:var(--ink);padding:7px 10px;border-radius:8px;font-size:14.5px}
.rail a:hover{background:var(--surface-2)}
.rail a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.rail a span.n{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
main{min-width:0}
.sec-head{margin-bottom:22px}
.sec-head .eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.sec-head h2{font-family:var(--f-display);font-weight:600;font-size:clamp(22px,3vw,30px);line-height:1.2;margin:6px 0 8px;text-wrap:balance}
.sec-head p{margin:0;color:var(--muted);max-width:70ch}
.stack{display:flex;flex-direction:column;gap:18px}
.prose{max-width:74ch}
.prose p{margin:0}
h3.bh{font-family:var(--f-display);font-weight:600;font-size:17px;margin:14px 0 0;line-height:1.3}
ul.bl,ol.bl{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;max-width:76ch}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-mono);font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);font-weight:600}
tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums;font-family:var(--f-mono);font-size:13.5px;white-space:nowrap}

.note{background:var(--accent-soft);border-radius:var(--r);padding:12px 16px;max-width:80ch}
.note.warn{background:var(--bad-soft)}
.note b:first-child{color:var(--accent)}
.note.warn b:first-child{color:var(--bad)}

/* task accordion */
details.task{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.task>summary{cursor:pointer;list-style:none;padding:14px 16px;display:flex;gap:12px;align-items:baseline;justify-content:space-between}
details.task>summary::-webkit-details-marker{display:none}
details.task>summary .t{font-weight:600;font-size:16px}
details.task>summary .m{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
details.task>summary::after{content:"+";font-family:var(--f-mono);color:var(--accent);font-size:18px;line-height:1}
details.task[open]>summary::after{content:"–"}
details.task[open]>summary{border-bottom:1px solid var(--line)}
.tbody{padding:16px;display:flex;flex-direction:column;gap:16px}
.lbl{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.lbl.acc{color:var(--accent)}

/* template */
.tmpl{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.tmpl-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 8px 8px 14px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.tmpl-h span{font-weight:600;font-size:14px}
.tmpl pre{margin:0;padding:14px;font-family:var(--f-mono);font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-word;overflow-x:auto}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:13.5px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.pri:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.sm{padding:3px 9px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:default}

/* phrases */
.phr{width:100%}
.phr td:first-child{font-weight:500}
.phr td.add{width:44px;text-align:right}
.addb{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-family:var(--f-mono);color:var(--accent);font-size:15px;line-height:1}
.addb.done{background:var(--good-soft);color:var(--good);border-color:transparent;cursor:default}

/* tips */
.tips{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 14px 16px}
.tips ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.tips li{position:relative;padding-left:18px}
.tips li::before{content:"";position:absolute;left:2px;top:.62em;width:7px;height:7px;background:var(--accent);border-radius:2px}
.tips .src{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);margin-left:6px}

/* plan */
.plan{display:flex;flex-direction:column;gap:8px}
.plan label{display:grid;grid-template-columns:22px 120px minmax(0,1fr);gap:10px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;cursor:pointer}
.plan label .w{font-family:var(--f-mono);font-size:12.5px;color:var(--accent);padding-top:2px}
.plan input{margin-top:4px;accent-color:var(--accent)}
.plan label.done{opacity:.6}
.plan label.done .x{text-decoration:line-through}

/* practice */
.set{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.set>summary{cursor:pointer;list-style:none;padding:14px 16px;display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.set>summary::-webkit-details-marker{display:none}
.set>summary .t{font-weight:600}
.set>summary .m{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.set[open]>summary{border-bottom:1px solid var(--line)}
.set-b{padding:16px;display:flex;flex-direction:column;gap:16px}
.passage{background:var(--surface-2);border-radius:8px;padding:14px 16px;max-height:420px;overflow:auto;font-size:15px}
.passage p{margin:0 0 10px}
.passage p:last-child{margin:0}
.q{display:flex;flex-direction:column;gap:8px;padding-top:4px}
.q .qt{font-weight:500}
.q .qt .qn{font-family:var(--f-mono);color:var(--accent);margin-right:6px;font-size:13px}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;background:var(--surface)}
.opt input{margin-top:4px;accent-color:var(--accent)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.q input[type=text]{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--surface);max-width:360px;width:100%}
.q input.ok{border-color:var(--good);background:var(--good-soft)}
.q input.no{border-color:var(--bad);background:var(--bad-soft)}
.expl{font-size:14px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
.expl b{color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.score{font-family:var(--f-mono);font-size:14px}
.score b{color:var(--accent)}
.tts{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--accent-soft);border-radius:8px;padding:10px 12px}
.tts label{font-size:13px;display:flex;gap:6px;align-items:center}

/* drill & writer */
.tool{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px}
.tool h3{margin:0;font-size:16px}
.cue{background:var(--surface-2);border-radius:8px;padding:14px 16px;white-space:pre-wrap;font-size:15.5px;min-height:64px}
.clock{font-family:var(--f-mono);font-size:34px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.clock.run{color:var(--accent)}
.clock.end{color:var(--bad)}
.writer textarea{width:100%;min-height:280px;border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--surface);line-height:1.6;resize:vertical;font-size:15px}
.wc{font-family:var(--f-mono);font-size:13px}
.wc.low{color:var(--bad)}
.wc.ok{color:var(--good)}
select.inp,input.inp,textarea.inp{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--surface);min-width:0}

/* resources */
.res-grp{display:flex;flex-direction:column;gap:8px}
.res{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:4px 18px;padding:10px 0;border-bottom:1px solid var(--line)}
.res:last-child{border-bottom:0}
.res a{font-weight:600}
.res .d{color:var(--muted);font-size:14.5px}
.resbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:4px 16px}

/* vocab */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.stat .v{font-family:var(--f-mono);font-size:22px;font-variant-numeric:tabular-nums}
.stat .k{font-size:12.5px;color:var(--muted)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:999px;cursor:pointer;font-size:14px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{border:1px solid var(--line);background:var(--surface);padding:5px 11px;border-radius:999px;cursor:pointer;font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.chip .n{font-family:var(--f-mono);font-size:11px;opacity:.75;margin-left:4px}
.fc-wrap{display:flex;flex-direction:column;gap:12px;align-items:stretch;max-width:640px}
.fc{background:var(--surface);border:1px solid var(--line);border-radius:14px;min-height:220px;padding:28px 24px;display:flex;flex-direction:column;justify-content:center;gap:12px;cursor:pointer;text-align:center;user-select:none}
.fc .term{font-size:clamp(22px,4vw,30px);font-weight:600;line-height:1.25}
.fc .mean{font-size:17px}
.fc .ex{font-size:14.5px;color:var(--muted);font-style:italic}
.fc .hint{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.fc .dk{font-family:var(--f-mono);font-size:11.5px;color:var(--accent);letter-spacing:.06em;text-transform:uppercase}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grade .btn{padding:10px;font-size:14px}
.grade .g0:hover{border-color:var(--bad);color:var(--bad)}
.grade .g2:hover{border-color:var(--good);color:var(--good)}
.dots{display:inline-flex;gap:3px;vertical-align:middle}
.dots i{width:7px;height:7px;border-radius:2px;background:var(--line)}
.dots i.on{background:var(--accent)}
.vt td{font-size:14.5px}
.vt td .ex{color:var(--muted);font-size:13.5px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.mode{font-family:var(--f-mono);font-size:12px;padding:4px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.mode.sync{background:var(--good-soft);color:var(--good)}
.empty{color:var(--muted);padding:18px;border:1px dashed var(--line);border-radius:var(--r);text-align:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:50;max-width:calc(100% - 32px)}
.confirm{display:inline-flex;gap:6px;align-items:center;font-size:13px}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);gap:18px;padding-block:0 64px}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;flex-direction:row;overflow-x:auto;background:var(--bg);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);scrollbar-width:none}
  .rail .grp{display:none}
  .rail a{white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px}
  .rail a span.n{display:none}
  .res{grid-template-columns:minmax(0,1fr)}
  .plan label{grid-template-columns:22px minmax(0,1fr)}
  .plan label .w{grid-column:2}
  .plan label .x{grid-column:2}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

</style>
</head>
<body>
<script>
window.APP = true;
window.HUB_URL = "./";
window.EXAM = {
id: "delf",
title: "Тренажёр DELF B2",
stamp: "DELF B2",

resIntro: "Официальные образцы France Éducation International, радио и пресса для понимания, словари и грамматические тренажёры.",
sections: [

{ id: "overview", nav: "Формат и план", grp: "Старт", title: "Формат DELF B2 и план подготовки",

<script>

}

const LS = {

let toastT;

/* ---------- vocabulary store (db capability, fallback: this browser) ---------- */
const Store = {

  loadLocal(){ this.words = LS.get("words", {}); this.prog = LS.get("prog", {}); },

  async init(){

    this.db = db; this.mode = "db";
    this.words = {}; this.prog = {};

      db.collection("mywords").onSnapshot(s => {
        const w = {}; s.docs.forEach(d => { w[d.id] = Object.assign({id: d.id}, d.data()); });

        const p = {}; s.docs.forEach(d => { const v = d.data(); p[d.id] = v && typeof v.box === "number" ? v.box : 0; });

  },
  toLocal(){

  write(path, data){

      const ref = this.db.doc(path);

    };

/* built-in words get stable ids; phrase tables and spelling blocks become decks too */
const BUILT = [];

(D.decks || []).forEach(dk => dk.words.forEach((w, i) => BUILT.push({id: dk.id + "-" + i, term: w[0], mean: w[1] || "", ex: w[2] || "", deck: dk.id, builtin: true})));
function hashId(s){ let x = 5381; for (let i = 0; i < s.length; i++) x = ((x << 5) + x + s.charCodeAt(i)) >>> 0; return x.toString(36); }
function clean(s){ return String(s).replace(/\*\*/g, "").replace(/`/g, ""); }

  const seen = new Set();
  D.sections.forEach(sec => {
    const id = "ph-" + sec.id, rows = [];
    const take = r => { const t = clean(r[0]); const key = t.toLowerCase(); if (seen.has(id + "|" + key)) return; seen.add(id + "|" + key); rows.push({id: id + "-" + hashId(key), term: t, mean: clean(r[1] || ""), ex: clean(r[2] || ""), deck: id, builtin: true}); };
    const scan = arr => arr.forEach(b => {

      }
      if (b[0] === "task"){ const p = b[3]; (p.phr || []).forEach(take); (p.more || []).forEach(m => m[1].forEach(take)); if (p.extra) scan(p.extra); }
    });
    scan(sec.blocks || []);
    if (rows.length){ DECKS.push({id, title: "Фразы: " + sec.nav}); rows.forEach(r => BUILT.push(r)); }
  });
}
function allWords(){ return BUILT.concat(Object.values(Store.words).sort((a, b) => (a.created || 0) - (b.created || 0))); }
function deckName(id){ if (id === "mine") return "Мои слова"; const d = DECKS.find(x => x.id === id); return d ? d.title : id; }

/* speaking / prompt drill with two timers */
function drillEl(o){

function writerEl(o){

/* spelling dictation */
function maskWord(w){ return w.replace(/[aeiouyàâäéèêëîïôöùûüœæ]/gi, "_"); }
function spellEl(o){
  const lang = o.lang || "en-GB";
  const tts = "speechSynthesis" in window;
  let order = shuffle(o.words), pos = -1, cur = null, right = 0, total = 0, answered = false;
  const misses = [];
  const meaning = h("div", {class:"cue", style:"min-height:0"}, "Нажми «Новое слово»: слово прозвучит, перевод появится здесь.");
  const inp = h("input", {type:"text", class:"inp", id: "sp-" + o.id, autocomplete:"off", autocapitalize:"off", spellcheck:"false", "aria-label":"Напиши слово", style:"max-width:360px;width:100%;font-size:17px"});
  const fb = h("div", {class:"expl", hidden: true});
  const sc = h("span", {class:"score"});
  const missBox = h("div");
  function say(){ if (!tts || !cur) return; try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(cur[0]); u.lang = lang; const v = voiceFor(lang); if (v) u.voice = v; u.rate = 0.85; speechSynthesis.speak(u); } catch(e){} }
  function next(){
    pos = (pos + 1) % order.length; if (pos === 0 && total) order = shuffle(o.words);
    cur = order[pos]; answered = false; inp.value = ""; inp.classList.remove("ok", "no"); fb.hidden = true;
    meaning.textContent = (cur[1] || "") + (tts ? "" : "   ·   " + maskWord(cur[0]));
    say(); inp.focus();
  }
  function drawMiss(){
    missBox.innerHTML = ""; if (!misses.length) return;
    const b = h("button", {class:"btn", type:"button"}, "Добавить ошибки в «Мои слова»");
    b.addEventListener("click", () => { let n = 0; misses.forEach(m => { if (!Store.hasTerm(m[0])){ Store.addWord({term: m[0], mean: m[1] || "", ex: m[2] || "", deck: "mine", src: "Орфография"}); n++; } }); toast(n ? "Добавлено слов: " + n : "Эти слова уже в словаре"); });
    missBox.append(h("div", {class:"row"}, h("span", {class:"score", text: "Ошибки: " + misses.map(m => m[0]).join(", ")}), b));
  }
  function check(){
    if (!cur || answered) return; answered = true; total++;
    const fix = x => x.trim().toLowerCase().replace(/[’`]/g, "'").replace(/\s+/g, " ");
    const ok = fix(inp.value) === fix(cur[0]);
    if (ok) right++; else if (!misses.includes(cur)) misses.push(cur);
    inp.classList.add(ok ? "ok" : "no");
    fb.hidden = false; fb.innerHTML = (ok ? "<b>Верно.</b> " : "<b>Правильно: " + esc(cur[0]) + ".</b> ") + esc(cur[2] || "");
    sc.innerHTML = "Верно <b>" + right + "</b> из " + total;
    drawMiss();
  }
  inp.addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); if (answered || !cur) next(); else check(); } });
  const bNext = h("button", {class:"btn pri", type:"button"}, "Новое слово"); bNext.addEventListener("click", next);
  const bSay = h("button", {class:"btn", type:"button", hidden: !tts}, "Повторить звук"); bSay.addEventListener("click", say);
  const bHint = h("button", {class:"btn", type:"button"}, "Подсказка"); bHint.addEventListener("click", () => { if (cur){ fb.hidden = false; fb.textContent = "Без гласных: " + maskWord(cur[0]); } });
  const bCheck = h("button", {class:"btn", type:"button"}, "Проверить"); bCheck.addEventListener("click", check);
  const table = h("details", {class:"task"}, h("summary", null, h("span", {class:"t", text: "Все слова и ловушки (" + o.words.length + ")"}), h("span", {class:"m", text: "таблица"})),
    h("div", {class:"tbody"}, phrTable("Слово", o.words.map(w => [w[0], (w[2] ? w[2] + " · " : "") + (w[1] || "")]), "Орфография")));
  return h("div", {class:"stack"},
    h("div", {class:"tool"}, h("h3", {text: o.title}), o.note ? h("div", {class:"prose"}, h("p", {html: md(o.note)})) : null,
      h("div", {class:"row"}, bNext, bSay, bHint), meaning, h("div", {class:"row"}, inp, bCheck), fb, h("div", {class:"row"}, sc), missBox,
      h("div", {class:"lbl", text: tts ? "Enter – проверить, ещё раз Enter – следующее слово" : "Синтез речи недоступен: пиши слово по переводу и маске"})),
    table);
}

/* ---------- practice sets ---------- */
function voiceFor(lang){
  try { const vs = speechSynthesis.getVoices(); return vs.find(v => v.lang === lang) || vs.find(v => v.lang && v.lang.slice(0, 2) === lang.slice(0, 2)) || null; } catch(e){ return null; }
}
function ttsEl(script, lang, note){
  const wrap = h("div", {class:"tts"});

  const show = h("button", {class:"btn", type:"button"}, "Показать текст");
  show.addEventListener("click", () => { txt.hidden = !txt.hidden; show.textContent = txt.hidden ? "Показать текст" : "Скрыть текст"; });
  const ok = "speechSynthesis" in window;
  if (ok){
    const rate = h("select", {class:"inp", "aria-label":"Скорость"}, [["0.85","0.85×"],["1","1×"],["1.1","1.1×"]].map(r => h("option", {value: r[0]}, r[1])));
    rate.value = "1";
    const play = h("button", {class:"btn pri", type:"button"}, "Слушать");
    const stopB = h("button", {class:"btn", type:"button"}, "Стоп");
    play.addEventListener("click", () => {
      try {
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(script.replace(/\n/g, " "));
        u.lang = lang; const v = voiceFor(lang); if (v) u.voice = v; u.rate = +rate.value;
        speechSynthesis.speak(u);
      } catch(e){ toast("Синтез речи недоступен, открой текст"); }
    });
    stopB.addEventListener("click", () => { try { speechSynthesis.cancel(); } catch(e){} });
    wrap.append(play, stopB, h("label", null, "Скорость", rate));
  } else {
    wrap.append(h("span", {text: "Синтез речи в этом браузере недоступен: прочитай текст один раз и закрой его."}));
  }
  wrap.append(show);
  return h("div", {class:"stack", style:"gap:8px"}, note ? h("div", {class:"prose"}, h("p", {html: md(note)})) : null, wrap, txt);
}
function norm(s){ return String(s).toLowerCase().replace(/[’']/g, "'").replace(/\s+/g, " ").replace(/[.,;:!?]+$/g, "").trim(); }
function setEl(ps){
  const body = h("div", {class:"set-b"});
  if (ps.intro) body.append(h("div", {class:"prose"}, h("p", {html: md(ps.intro)})));
  if (ps.text) body.append(h("div", {class:"passage"}, ps.text.split("\n").map(x => h("p", {html: md(x)}))));
  if (ps.script) body.append(ttsEl(ps.script, ps.lang || "en-GB", ps.scriptNote));
  const checkers = [];
  ps.qs.forEach((q, qi) => {
    const box = h("div", {class:"q"});
    box.append(h("div", {class:"qt", html: '<span class="qn">' + (qi + 1) + "</span>" + md(q.q)}));
    const ex = h("div", {class:"expl", hidden: true, html: "<b>Ответ:</b> " + md(answerText(q)) + (q.e ? "<br>" + md(q.e) : "")});
    if (q.o){
      const multi = Array.isArray(q.a);
      const name = ps.id + "-q" + qi;
      const opts = q.o.map((o, oi) => {
        const inp = h("input", {type: multi ? "checkbox" : "radio", name, value: oi, id: name + "-" + oi});
        return h("label", {class:"opt", for: inp.id}, inp, h("span", {html: md(o)}));
      });
      box.append(h("div", {class:"opts"}, opts));
      checkers.push(() => {
        const picked = opts.map((l, i) => l.querySelector("input").checked ? i : -1).filter(i => i >= 0);
        const right = multi ? q.a : [q.a];
        opts.forEach((l, i) => { l.classList.remove("ok", "no"); if (right.includes(i)) l.classList.add("ok"); else if (picked.includes(i)) l.classList.add("no"); });
        ex.hidden = false;

    } else {
      const inp = h("input", {type:"text", id: ps.id + "-q" + qi, autocomplete:"off", spellcheck:"false", "aria-label":"Ответ " + (qi + 1)});
      box.append(inp);
      checkers.push(() => {
        const ok = (Array.isArray(q.a) ? q.a : [q.a]).some(a => norm(a) === norm(inp.value));
        inp.classList.remove("ok", "no"); inp.classList.add(ok ? "ok" : "no"); ex.hidden = false; return ok;
      });
    }
    box.append(ex);

  });
  const score = h("span", {class:"score"});
  const best = LS.get("best-" + ps.id, null);
  if (best != null) score.innerHTML = "Лучший результат: <b>" + best + "/" + ps.qs.length + "</b>";

  check.addEventListener("click", () => {
    const n = checkers.reduce((s, f) => s + (f() ? 1 : 0), 0);

    score.innerHTML = "Результат: <b>" + n + "/" + ps.qs.length + "</b>" + (ps.band ? " · " + esc(ps.band(n)) : "") + " · лучший " + b;

  const reset = h("button", {class:"btn", type:"button"}, "Сбросить");
  reset.addEventListener("click", () => {
    body.querySelectorAll("input").forEach(i => { if (i.type === "text") i.value = ""; else i.checked = false; i.classList.remove("ok", "no"); });
    body.querySelectorAll(".opt").forEach(l => l.classList.remove("ok", "no"));
    body.querySelectorAll(".expl").forEach(e => e.hidden = true);
    score.textContent = "";
  });
  body.append(h("div", {class:"row"}, check, reset, score));
  return h("details", {class:"set", id: "set-" + ps.id}, h("summary", null, h("span", {class:"t", text: ps.title}), h("span", {class:"m", text: (ps.tag ? ps.tag + " · " : "") + ps.qs.length + " вопр."})), body);
}
function answerText(q){
  if (q.o) return (Array.isArray(q.a) ? q.a : [q.a]).map(i => q.o[i]).join(" + ");
  return Array.isArray(q.a) ? q.a[0] : q.a;
}

function dots(n){ return h("span", {class:"dots", "aria-label": "уровень " + n + " из 5"}, [0,1,2,3,4].map(i => h("i", {class: i < n ? "on" : null}))); }

function cards(pane){

  const counter = h("span", {class:"score"});

async function saveFile(filename, text, mime){
  let dl = null;
  try { if (window.claude && typeof window.claude.use === "function") dl = await window.claude.use("downloads"); } catch(e){}
  if (dl){
    try { await dl.save({filename, data: text}); toast("Файл сохранён"); return true; }
    catch(e){ if (e && e.code === "declined") return true; }
  }
  if (window.claude) return false;
  const blob = new Blob([text], {type: mime || "text/plain"});
  const mobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
  try {
    const file = new File([blob], filename, {type: blob.type});
    if (mobile && navigator.canShare && navigator.canShare({files: [file]})){ await navigator.share({files: [file], title: filename}); return true; }
  } catch(e){ if (e && e.name === "AbortError") return true; }
  try {
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast("Файл сохранён"); return true;
  } catch(e){ return false; }
}
async function exportCsv(){
  const ws = filtered();
  const rows = ws.map(w => [w.term, w.mean, w.ex].map(x => '"' + String(x || "").replace(/"/g, '""') + '"').join(";"));
  const csv = rows.join("\n");
  if (await saveFile(D.id + "-" + (V.deck === "all" ? "vocab" : V.deck) + ".csv", csv, "text/csv")) return;
  copyText(csv); toast("CSV скопирован в буфер: вставь в Anki через «Импорт»");
}
/* progress backup: everything this trainer keeps (words, levels, drafts, plan ticks, best scores) */
async function exportProgress(){
  const ls = {};
  try { for (let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); if (k.indexOf(D.id + ":") === 0 && !/:(words|prog)$/.test(k)) ls[k] = localStorage.getItem(k); } } catch(e){}
  const data = JSON.stringify({app: "exam-trainer", exam: D.id, v: 1, saved: new Date().toISOString(), words: Store.words, prog: Store.prog, ls}, null, 1);
  const name = D.id + "-progress-" + new Date().toISOString().slice(0, 10) + ".json";
  if (await saveFile(name, data, "application/json")) return;
  copyText(data); toast("Резервная копия скопирована в буфер обмена");
}
function importProgress(text){
  let o; try { o = JSON.parse(text); } catch(e){ toast("Это не файл прогресса"); return; }
  if (!o || o.app !== "exam-trainer"){ toast("Это не файл прогресса тренажёра"); return; }
  if (o.exam !== D.id){ toast("Этот файл от другого тренажёра: " + String(o.exam).toUpperCase()); return; }
  let nw = 0, np = 0;
  Object.keys(o.words || {}).forEach(id => {
    const w = o.words[id]; if (!w || !w.term || Store.words[id] || Store.hasTerm(w.term)) return;
    Store.words[id] = Object.assign({id}, w);
    if (Store.mode === "db") Store.write("mywords/" + id, {term: w.term, mean: w.mean || "", ex: w.ex || "", deck: w.deck || "mine", src: w.src || "", created: w.created || Date.now()});
    nw++;
  });
  Object.keys(o.prog || {}).forEach(id => { const b = +o.prog[id] || 0; if (b > (Store.prog[id] || 0)){ Store.setBox(id, b); np++; } });
  try { Object.keys(o.ls || {}).forEach(k => { if (k.indexOf(D.id + ":") === 0) localStorage.setItem(k, o.ls[k]); }); } catch(e){}
  if (Store.mode !== "db") Store.saveLocal();
  Store.emit();
  toast("Загружено: слов " + nw + ", уровней " + np + ". Обновляю страницу…");
  setTimeout(() => location.reload(), 1400);
}
